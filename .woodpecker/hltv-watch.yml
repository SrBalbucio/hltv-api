when:
  event: [cron, manual]
  cron: hltv-watch

steps:
  hltv-watch:
    image: node:22-bookworm-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates diffutils fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libglib2.0-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils && rm -rf /var/lib/apt/lists/*
      - npm install -g pnpm@11.20.0
      - pnpm install --frozen-lockfile
      - HEADLESS=true pnpm watch:hltv

  notify-discord-success:
    depends_on:
      - hltv-watch
    image: alpine:3.20
    commands:
      - apk add --no-cache bash curl python3
      - bash scripts/notify-discord.sh success
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url

  notify-discord-hltv-failure:
    depends_on:
      - hltv-watch
    image: alpine:3.20
    commands:
      - apk add --no-cache bash curl python3
      - bash scripts/notify-discord.sh failure
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    when:
      - status: [failure]
