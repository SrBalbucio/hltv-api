services:
  redis:
    image: redis
    container_name: hltv-redis
    ports:
      - "6378:6379"
    volumes:
      - ./data:/var/lib/redis/data

  api:
    build: .
    container_name: hltv-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379
      HEADLESS: "true"
      # CF_CHALLENGE_WAIT_MS: 30000
      # CAPSOLVER_API_KEY:
      # CAPSOLVER_PROXY:
    volumes:
      - chrome-profile:/app/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  chrome-profile:
